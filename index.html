<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRV Tracker - Kontrol Kamera Manual</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        video { width: 100%; max-width: 200px; border-radius: 12px; background: #000; margin-bottom: 10px; display: none; }
        .chart-container { width: 100%; height: 150px; margin-bottom: 20px; }
        
        /* Kontrol Kamera Baru */
        .controls-container { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #dee2e6; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ced4da; margin-bottom: 10px; font-size: 14px; }
        .btn-torch { background: #ffc107; color: #212529; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        
        .btn-start { background: #0056b3; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px; }
        .btn-start:disabled { background: #adb5bd; cursor: not-allowed; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .metric-box { padding: 10px; background: #e9ecef; border-radius: 10px; border-left: 4px solid #0056b3; }
        .metric-title { font-size: 11px; color: #6c757d; text-transform: uppercase; font-weight: bold; }
        .metric-value { font-size: 20px; font-weight: bold; color: #212529; margin-top: 5px; }
        #statusText { margin-top: 10px; font-weight: bold; color: #dc3545; font-size: 14px; }
        .payload-box { margin-top: 20px; padding: 15px; background: #282c34; color: #abb2bf; border-radius: 8px; text-align: left; font-size: 12px; overflow-x: auto; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pemindai Bio-Sinyal Manual</h2>
        
        <!-- Panel Kontrol Kamera (Pilihan Lensa & Senter) -->
        <div class="controls-container">
            <label for="cameraSelect" style="display:block; text-align:left; font-size: 12px; font-weight:bold; margin-bottom:5px;">Pilih Lensa Kamera:</label>
            <select id="cameraSelect">
                <option value="">Memuat daftar kamera...</option>
            </select>
            <button id="torchBtn" class="btn-torch">Hidupkan Senter (Jika Didukung)</button>
            <p style="font-size: 11px; color: #666; margin-top: 5px; text-align: left;">*Jika senter tidak menyala, silakan hidupkan senter secara manual melalui menu tarik-turun HP Anda.</p>
        </div>

        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement" style="display:none;"></canvas>
        
        <div class="chart-container">
            <canvas id="signalChart"></canvas>
        </div>
        
        <button id="startBtn" class="btn-start">Mulai Pengukuran (60 Detik)</button>
        <p id="statusText">Status: Siap mengukur.</p>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-title">Kualitas</div>
                <div class="metric-value" id="signalQuality" style="font-size: 14px;">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Sisa Waktu</div>
                <div class="metric-value" id="timeValue">60s</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Baseline</div>
                <div class="metric-value" id="baselineValue">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">BPM</div>
                <div class="metric-value" id="bpmValue">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">RMSSD</div>
                <div class="metric-value" id="hrvValue">--</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">SDNN</div>
                <div class="metric-value" id="sdnnValue">--</div>
            </div>
        </div>

        <div id="aiPayloadContainer" class="payload-box">
            <strong>Data siap dikirim ke Google AI Studio:</strong>
            <pre id="jsonPayloadOut"></pre>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // UI Elements
        const cameraSelect = document.getElementById('cameraSelect');
        const torchBtn = document.getElementById('torchBtn');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const bpmValue = document.getElementById('bpmValue');
        const hrvValue = document.getElementById('hrvValue');
        const sdnnValue = document.getElementById('sdnnValue');
        const baselineValue = document.getElementById('baselineValue');
        const signalQuality = document.getElementById('signalQuality');
        const timeValue = document.getElementById('timeValue');
        const payloadContainer = document.getElementById('aiPayloadContainer');
        const jsonPayloadOut = document.getElementById('jsonPayloadOut');

        let isMeasuring = false;
        let animationId;
        let stream;
        let track;
        let isTorchOn = false;
        
        // Data Buffer
        const BUFFER_SIZE = 120; 
        let rawSignal = []; let filteredSignal = []; let timeStamps = []; let rrIntervals = []; let lastPeakTime = 0;
        const REFRACTORY_PERIOD = 330; 

        // Setup Chart
        const chartCtx = document.getElementById('signalChart').getContext('2d');
        const signalChart = new Chart(chartCtx, {
            type: 'line',
            data: { labels: new Array(50).fill(''), datasets: [{ label: 'Gelombang Nadi', data: new Array(50).fill(0), borderColor: '#dc3545', borderWidth: 2, tension: 0.4, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } }
        });

        // ==========================================
        // FUNGSI KONTROL KAMERA MANUAL
        // ==========================================
        
        // 1. Ambil daftar semua kamera saat halaman dimuat
        async function getCameras() {
            try {
                // Pancing izin terlebih dahulu
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    // Tampilkan label kamera (misal: "Kamera belakang 0", "Kamera belakang 1")
                    option.text = device.label || `Kamera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                
                // Jika ada kamera, otomatis nyalakan yang pertama di list
                if (videoDevices.length > 0) {
                    startSelectedCamera(videoDevices[videoDevices.length - 1].deviceId); // Coba ambil kamera belakang biasanya di akhir list
                }
            } catch(err) {
                alert("Gagal memuat daftar kamera: " + err.message);
            }
        }

        // 2. Jalankan kamera yang dipilih dari dropdown
        async function startSelectedCamera(deviceId) {
            if (stream) {
                // Matikan stream sebelumnya
                stream.getTracks().forEach(t => t.stop());
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: deviceId } }
                });
                track = stream.getVideoTracks()[0];
                video.srcObject = stream;
                await video.play();
                
                // Reset status senter
                isTorchOn = false;
                torchBtn.innerText = "Hidupkan Senter";
                torchBtn.style.background = "#ffc107";
                
            } catch(err) {
                console.error("Gagal memulai kamera spesifik:", err);
            }
        }

        // Event Listener untuk Dropdown Kamera
        cameraSelect.addEventListener('change', (e) => {
            startSelectedCamera(e.target.value);
        });

        // Event Listener untuk Tombol Senter
        torchBtn.addEventListener('click', async () => {
            if (!track) return;
            try {
                isTorchOn = !isTorchOn;
                await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                
                if (isTorchOn) {
                    torchBtn.innerText = "Matikan Senter";
                    torchBtn.style.background = "#dc3545";
                    torchBtn.style.color = "white";
                } else {
                    torchBtn.innerText = "Hidupkan Senter";
                    torchBtn.style.background = "#ffc107";
                    torchBtn.style.color = "black";
                }
            } catch(e) {
                alert("Browser Samsung memblokir akses senter otomatis ke lensa ini. Silakan nyalakan senter manual dari menu tarik-turun HP Anda.");
                isTorchOn = !isTorchOn; // Kembalikan status
            }
        });

        // Jalankan saat halaman dibuka
        window.addEventListener('load', () => {
            getCameras();
            updateBaselineUI();
        });

        // ==========================================
        // ALGORITMA HRV & DSP (Tidak Berubah)
        // ==========================================

        function getMovingAverage(array, windowSize) {
            if (array.length < windowSize) return array[array.length - 1];
            let sum = 0; for (let i = array.length - windowSize; i < array.length; i++) sum += array[i];
            return sum / windowSize;
        }

        function processFrame() {
            if (!isMeasuring) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const frame = ctx.getImageData(canvas.width / 2 - 50, canvas.height / 2 - 50, 100, 100);
            const data = frame.data;
            
            let redSum = 0; let isFingerPlaced = false;

            for (let i = 0; i < data.length; i += 4) {
                redSum += data[i]; 
                if (data[i] > 150 && data[i+1] < 100) isFingerPlaced = true;
            }
            
            signalQuality.innerText = isFingerPlaced ? "Bagus" : "Lepas!";
            signalQuality.style.color = isFingerPlaced ? "green" : "red";

            rawSignal.push(redSum / (data.length / 4));
            timeStamps.push(performance.now());
            filteredSignal.push(getMovingAverage(rawSignal, 5));

            if (rawSignal.length > BUFFER_SIZE) { rawSignal.shift(); filteredSignal.shift(); timeStamps.shift(); }

            if (filteredSignal.length > 50 && isFingerPlaced) {
                signalChart.data.datasets[0].data = filteredSignal.slice(-50);
                signalChart.update();
            }

            if (filteredSignal.length === BUFFER_SIZE && isFingerPlaced) {
                let bufferAvg = filteredSignal.reduce((a, b) => a + b) / BUFFER_SIZE;
                let midIndex = BUFFER_SIZE - 5; let midValue = filteredSignal[midIndex];

                if (midValue > filteredSignal[midIndex - 1] && midValue > filteredSignal[midIndex + 1] && midValue > (bufferAvg * 1.002)) { 
                    let peakTime = timeStamps[midIndex];
                    let timeSinceLastPeak = peakTime - lastPeakTime;
                    if (timeSinceLastPeak > REFRACTORY_PERIOD) {
                        if (lastPeakTime > 0) { rrIntervals.push(timeSinceLastPeak); calculateAdvancedMetrics(); }
                        lastPeakTime = peakTime;
                    }
                }
            }
            animationId = requestAnimationFrame(processFrame);
        }

        let finalBPM = 0, finalRMSSD = 0, finalSDNN = 0;

        function calculateAdvancedMetrics() {
            if (rrIntervals.length < 5) return;
            let cleanRR = rrIntervals.filter((val, i, arr) => { if(i === 0) return true; let ratio = val / arr[i-1]; return ratio > 0.8 && ratio < 1.2; });
            if (cleanRR.length < 2) return;

            const avgRR = cleanRR.reduce((a, b) => a + b) / cleanRR.length;
            finalBPM = Math.round(60000 / avgRR);
            
            let sumSqDiffs = 0; for (let i = 1; i < cleanRR.length; i++) sumSqDiffs += Math.pow(cleanRR[i] - cleanRR[i-1], 2);
            finalRMSSD = Math.round(Math.sqrt(sumSqDiffs / (cleanRR.length - 1)));

            let sumSqDiffRR = 0; for(let i = 0; i < cleanRR.length; i++) sumSqDiffRR += Math.pow(cleanRR[i] - avgRR, 2);
            finalSDNN = Math.round(Math.sqrt(sumSqDiffRR / (cleanRR.length - 1)));

            bpmValue.innerText = finalBPM; hrvValue.innerText = finalRMSSD; sdnnValue.innerText = finalSDNN;
        }

        function updateBaselineUI() {
            let history = JSON.parse(localStorage.getItem('hrvHistory') || '[]');
            if (history.length === 0) { baselineValue.innerText = "Belum ada"; return 0; }
            let avgRmssd = Math.round(history.reduce((sum, record) => sum + record.rmssd, 0) / history.length);
            baselineValue.innerText = avgRmssd + " ms";
            return avgRmssd;
        }

        function generateAIPayload() {
            let currentBaseline = updateBaselineUI();
            let history = JSON.parse(localStorage.getItem('hrvHistory') || '[]');
            history.push({ date: new Date().toISOString(), bpm: finalBPM, rmssd: finalRMSSD, sdnn: finalSDNN });
            localStorage.setItem('hrvHistory', JSON.stringify(history));

            const payload = {
                timestamp: new Date().toISOString(),
                metrics: { heart_rate_bpm: finalBPM, hrv_rmssd_ms: finalRMSSD, hrv_sdnn_ms: finalSDNN },
                user_baseline_rmssd: currentBaseline || finalRMSSD,
                context: "Pengukuran HRV menggunakan optical PPG 60 detik."
            };

            payloadContainer.style.display = "block";
            jsonPayloadOut.innerText = JSON.stringify(payload, null, 2);
        }

        // ==========================================
        // KONTROL PENGUKURAN
        // ==========================================
        startBtn.addEventListener('click', async () => {
            if (!stream) {
                alert("Pilih dan aktifkan kamera terlebih dahulu melalui menu di atas.");
                return;
            }
            
            isMeasuring = true;
            startBtn.disabled = true;
            startBtn.innerText = "Sedang Mengukur...";
            statusText.innerText = "Mengukur... Bernapaslah dengan stabil.";
            statusText.style.color = "#0056b3";
            payloadContainer.style.display = "none";
            
            rawSignal = []; filteredSignal = []; timeStamps = []; rrIntervals = []; lastPeakTime = 0;
            bpmValue.innerText = "--"; hrvValue.innerText = "--"; sdnnValue.innerText = "--";
            
            processFrame();

            let timeLeft = 60;
            let timerInterval = setInterval(() => {
                timeLeft--;
                timeValue.innerText = timeLeft + "s";
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isMeasuring = false;
                    cancelAnimationFrame(animationId);
                    startBtn.disabled = false;
                    startBtn.innerText = "Mulai Pengukuran (60 Detik)";
                    statusText.innerText = "Selesai. Memproses data AI...";
                    statusText.style.color = "green";
                    
                    generateAIPayload();
                    updateBaselineUI();
                }
            }, 1000);
        });
    </script>
</body>
</html>
